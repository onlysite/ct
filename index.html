<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城通解析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:sans-serif;
    background:#f4f4f4;
    padding:20px;
}
.main{
    max-width:420px;
    margin:0 auto;
    background:#fff;
    padding:22px;
    border-radius:12px;
}
h3{
    text-align:center;
    margin-bottom:14px;
}
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:8px;
}
#tip{
    margin-top:10px;
    text-align:center;
}
</style>
</head>
<body>
<div class="main">
    <h3>城通网盘解析</h3>
    <input id="link" placeholder="粘贴ctfile链接">
    <button onclick="start()">解析下载</button>
    <div id="tip"></div>
</div>

<script>
const API = "http://ct.onlysite.dpdns.org";
async function start(){
    const link=document.getElementById("link").value;
    const tip=document.getElementById("tip");
    if(!link){tip.innerHTML="请输入链接";return;}
    tip.innerHTML="获取中...";
    try{
        let res=await fetch(API+"/download_info?xtlink="+encodeURIComponent(link));
        let data=await res.json();
        let name=data[0].name;
        let url=API+"/download?xtlink="+encodeURIComponent(link)+"&file_id="+data[0].key;
        tip.innerHTML="文件："+name;
        window.open(url,"_blank");
    }catch(e){
        tip.innerHTML="解析失败";
    }
}
</script>
</body>
</html>
