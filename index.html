<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城通解析</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#f5f5f5;
    padding:20px;
    font-family:sans-serif;
  }
  .box{
    max-width:400px;
    margin:0 auto;
    background:#fff;
    padding:22px;
    border-radius:12px;
  }
  h3{
    text-align:center;
    margin-bottom:16px;
  }
  input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
  }
  button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:8px;
  }
  .tip{
    margin-top:12px;
    text-align:center;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="box">
  <h3>城通网盘解析</h3>
  <input id="link" placeholder="粘贴ctfile链接">
  <button onclick="parse()">解析下载</button>
  <div class="tip" id="tip"></div>
</div>

<script>
const API = "http://ct.onlysite.dpdns.org";

async function parse() {
  const link = document.getElementById("link").value.trim();
  const tip = document.getElementById("tip");

  if (!link) {
    tip.textContent = "请输入链接";
    return;
  }

  tip.textContent = "获取文件信息...";

  try {
    // 只走 info 接口
    const res = await fetch(`${API}/download_info?xtlink=${encodeURIComponent(link)}`);
    const data = await res.json();
    const name = data[0].name;
    const fid = data[0].key;
    const url = `${API}/download?xtlink=${encodeURIComponent(link)}&file_id=${fid}`;

    tip.textContent = "文件：" + name;

    // 最稳下载方式
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();

    tip.textContent = "✅ 下载中：" + name;

  } catch (e) {
    tip.textContent = "解析失败";
  }
}
</script>
</body>
</html>
