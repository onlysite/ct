<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城通解析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#f6f6f6;
    padding:20px;
    font-family:sans-serif
}
.container{
    max-width:420px;
    margin:0 auto;
    background:#fff;
    padding:24px;
    border-radius:12px;
}
h3{
    text-align:center;
    margin-bottom:16px;
}
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:8px;
}
#info{
    margin-top:12px;
    line-height:1.6;
    word-break:break-all;
}
</style>
</head>
<body>
<div class="container">
    <h3>城通网盘解析</h3>
    <input id="link" placeholder="粘贴ctfile链接">
    <button onclick="parse()">解析并下载</button>
    <div id="info"></div>
</div>

<script>
const API = "http://ct.onlysite.dpdns.org";

async function parse() {
    const link = document.getElementById("link").value.trim();
    const info = document.getElementById("info");
    
    if (!link) { info.textContent = "请输入链接"; return; }
    info.textContent = "获取中...";

    try {
        // 先请求获取真实直链（含downname）
        const resp = await fetch(`${API}/download?xtlink=${encodeURIComponent(link)}&file_id=`, { method: 'HEAD', redirect: 'follow' });
        
        // 拿到最终的真实下载地址（带downname）
        const realUrl = resp.url;
        info.textContent = "下载地址已获取";

        // 直接下载，浏览器自动识别 downname 文件名
        const a = document.createElement("a");
        a.href = realUrl;
        document.body.appendChild(a);
        a.click();
        a.remove();

        info.textContent = "✅ 下载开始，文件名自动正确";
        
    } catch(e) {
        info.textContent = "解析失败";
    }
}
</script>
</body>
</html>
