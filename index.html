<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城通解析</title>
<style>
  body{max-width:500px;margin:40px auto;padding:0 20px;font-family:Arial}
  .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 10px #0000001a}
  input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
  button{width:100%;padding:12px;background:#007bff;color:#fff;border:0;border-radius:8px;font-size:16px}
  .tip{margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h3>城通网盘解析</h3>
  <input id="link" placeholder="粘贴 ctfile:// 链接">
  <button onclick="parse()">解析并下载</button>
  <div class="tip" id="tip"></div>
</div>

<script>
const API = "http://ct.onlysite.dpdns.org";

async function parse() {
  const link = document.getElementById("link").value.trim();
  const tip = document.getElementById("tip");
  
  if (!link) { tip.textContent = "请输入链接"; return; }
  tip.textContent = "获取文件信息...";

  try {
    // 先拿文件名
    const res = await fetch(`${API}/download_info?xtlink=${encodeURIComponent(link)}`);
    const data = await res.json();
    const name = data[0].name;
    const fid = data[0].key;
    const downUrl = `${API}/download?xtlink=${encodeURIComponent(link)}&file_id=${fid}`;

    tip.textContent = "文件名：" + name + "，开始下载...";

    // 强制以正确文件名下载（核心解决乱码命名）
    const blob = await fetch(downUrl).then(r => r.blob());
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name; // 强制写文件名
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);

    tip.textContent = "✅ 下载完成：" + name;

  } catch (e) {
    tip.textContent = "错误：" + e.message;
  }
}
</script>
</body>
</html>
